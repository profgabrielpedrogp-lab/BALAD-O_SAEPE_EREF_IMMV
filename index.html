<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baladão SAEPE 2026</title>
<style>
:root{
  --bg:#07051a; --bg2:#120a33; --card:#150f3a; --card2:#1c1450; --ink:#f5f2ff; --mute:#a9a3d6;
  --pink:#ff2d95; --cyan:#19e6ff; --yel:#ffd400; --blue:#2d6bff; --ok:#22e58b; --bad:#ff4d6d;
  --line:rgba(255,255,255,.12); --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
/* fundo de balada */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(1200px 700px at 15% -10%,#3b1587 0,transparent 60%),radial-gradient(900px 600px at 100% 10%,#0a3a8f 0,transparent 55%),radial-gradient(900px 700px at 50% 120%,#7a0a55 0,transparent 60%),var(--bg)}
.beam{position:absolute;top:-20%;width:26vw;height:140%;transform-origin:50% 0;filter:blur(26px);opacity:.28;mix-blend-mode:screen;animation:sway 7s ease-in-out infinite alternate}
.beam.b1{left:6%;background:linear-gradient(180deg,var(--pink),transparent 75%)}
.beam.b2{left:36%;background:linear-gradient(180deg,var(--cyan),transparent 75%);animation-delay:-2s;animation-duration:9s}
.beam.b3{left:66%;background:linear-gradient(180deg,var(--yel),transparent 75%);animation-delay:-4s;animation-duration:8s}
@keyframes sway{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
/* topo */
header.top{display:flex;align-items:center;gap:16px;padding:12px clamp(14px,2.4vw,32px);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);background:rgba(7,5,26,.55);position:sticky;top:0;z-index:20}
header.top img{height:44px;width:auto;border-radius:50%;background:#fff;padding:2px}
.brand{font-weight:900;letter-spacing:.04em;font-size:clamp(15px,1.6vw,20px);line-height:1}
.brand small{display:block;font-weight:600;letter-spacing:.14em;font-size:10px;color:var(--mute);margin-top:4px;text-transform:uppercase}
nav.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--mute);border:1px solid transparent}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.tab.on{color:#07051a;background:linear-gradient(90deg,var(--yel),#ffb300)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:17px}
.iconbtn:hover{background:rgba(255,255,255,.12)}
main{flex:1;padding:clamp(14px,2.2vw,30px);display:flex;flex-direction:column;gap:18px;max-width:1500px;width:100%;margin:0 auto}
/* splash */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:30px 0}
.splash .logo{width:min(220px,40vw);border-radius:50%;background:#fff;padding:6px;box-shadow:0 0 0 4px var(--blue),0 0 60px 6px rgba(45,107,255,.55);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.school{letter-spacing:.2em;text-transform:uppercase;font-size:clamp(11px,1.2vw,14px);color:var(--cyan);font-weight:700}
.mega{font-size:clamp(46px,11vw,150px);font-weight:900;line-height:1.02;padding:.08em .04em 0;letter-spacing:-.02em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--pink),var(--yel),var(--cyan),var(--pink));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;
  filter:drop-shadow(0 0 22px rgba(255,45,149,.45))}
@keyframes shine{to{background-position:300% 0}}
.sub{font-size:clamp(15px,2vw,24px);color:var(--mute);max-width:820px}
.sub b{color:var(--ink)}
.cta{margin-top:6px;padding:18px 44px;border-radius:999px;font-weight:900;font-size:clamp(18px,2vw,26px);letter-spacing:.06em;text-transform:uppercase;color:#07051a;background:linear-gradient(90deg,var(--yel),#ff9d00);box-shadow:0 10px 40px rgba(255,212,0,.35);transition:transform .15s}
.cta:hover{transform:scale(1.05)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:13px;color:var(--mute)}
/* faixa */
.stage{display:grid;grid-template-columns:minmax(300px,.8fr) 1.7fr;gap:18px;align-items:start}
.panel{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2vw,26px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.deck{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;position:sticky;top:84px}
.faixa-tag{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:800}
.vinyl{width:min(230px,58%);aspect-ratio:1;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at center,#0b0b14 0 3px,#171726 3px 5px);box-shadow:0 0 0 3px #000,0 0 50px rgba(255,45,149,.5);animation:spin 5s linear infinite}
.vinyl::before{content:"";position:absolute;inset:32%;border-radius:50%;background:conic-gradient(var(--pink),var(--yel),var(--cyan),var(--pink))}
.vinyl::after{content:"";position:absolute;inset:47%;border-radius:50%;background:#07051a}
.vinyl.paused{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.song{font-size:clamp(22px,2.6vw,34px);font-weight:900;line-height:1.05}
.artist{color:var(--mute);font-weight:600}
.eq{display:flex;align-items:flex-end;gap:3px;height:38px}
.eq i{display:block;width:6px;border-radius:3px 3px 0 0;background:linear-gradient(var(--pink),var(--cyan));height:20%;animation:eq 1s ease-in-out infinite alternate}
.eq.off i{animation-play-state:paused;opacity:.4}
@keyframes eq{to{height:100%}}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.pri{background:linear-gradient(90deg,var(--pink),#c21cff);border-color:transparent}
.btn.yel{background:linear-gradient(90deg,var(--yel),#ff9d00);color:#07051a;border-color:transparent}
.btn.sm{padding:7px 11px;font-size:12px}
.deck audio{width:100%;height:36px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:22px;height:22px;border-radius:7px;font-size:10px;font-weight:800;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--mute)}
.dot.now{outline:2px solid var(--yel);color:var(--ink)}
.dot.ok{background:var(--ok);color:#042}
.dot.no{background:var(--bad);color:#300}
/* pergunta */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.pill.pt{background:rgba(25,230,255,.15);color:var(--cyan);border:1px solid rgba(25,230,255,.4)}
.pill.mt{background:rgba(255,212,0,.14);color:var(--yel);border:1px solid rgba(255,212,0,.4)}
.skill{color:var(--mute);font-size:14px;font-weight:600;flex:1;min-width:180px}
.ring{width:64px;height:64px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:rgba(255,255,255,.12)}
.ring .pg{stroke:var(--cyan);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring.low .pg{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:900}
.ctx{border-left:4px solid var(--pink);background:rgba(255,255,255,.05);padding:14px 18px;border-radius:0 14px 14px 0;font-size:clamp(16px,1.7vw,21px);line-height:1.5;margin-bottom:14px;font-style:italic}
.q{font-size:clamp(19px,2.2vw,30px);font-weight:800;line-height:1.25;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 18px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.05);font-size:clamp(16px,1.7vw,22px);font-weight:600;transition:transform .12s,background .12s,border-color .12s}
.opt:hover:not(:disabled){transform:translateX(6px);border-color:var(--cyan);background:rgba(25,230,255,.1)}
.opt .l{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--blue),#7a2cff)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(34,229,139,.18);animation:pop .5s}
.opt.right .l{background:var(--ok);color:#032}
.opt.wrong{border-color:var(--bad);background:rgba(255,77,109,.16);animation:shake .4s}
.opt.wrong .l{background:var(--bad)}
.opt.dim{opacity:.45}
@keyframes pop{40%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:16px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.25);animation:rise .35s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.fb h4{font-size:18px;margin-bottom:6px}
.fb.ok h4{color:var(--ok)} .fb.no h4{color:var(--bad)}
.fb p{color:var(--mute);line-height:1.5}
.pts{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:999px;background:var(--yel);color:#07051a;font-weight:900;font-size:14px}
.qfoot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.qfoot .sp{flex:1}
.kbd{font-size:12px;color:var(--mute)}
kbd{padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:11px}
/* equipes */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.team{position:relative;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.05);text-align:left;transition:.15s}
.team:hover{background:rgba(255,255,255,.1)}
.team.on{border-color:var(--yel);background:rgba(255,212,0,.12);box-shadow:0 0 30px rgba(255,212,0,.25)}
.team .n{font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:6px}
.team .s{font-size:clamp(26px,3vw,40px);font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.team .st{font-size:12px;color:var(--mute)}
.team .vez{font-size:10px;letter-spacing:.15em;color:var(--yel);font-weight:900}
.tcol{--c:var(--pink)}
/* painel */
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;min-height:260px;padding-top:10px}
.pd{flex:1;max-width:190px;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.pd .bar{border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:10px;font-weight:900;font-size:34px;animation:grow .9s cubic-bezier(.2,.9,.3,1.2) backwards;color:#07051a}
.pd.p1 .bar{background:linear-gradient(var(--yel),#ff9d00);height:200px}
.pd.p2 .bar{background:linear-gradient(#e6ecff,#9aa8d6);height:150px}
.pd.p3 .bar{background:linear-gradient(#ffb67a,#c2703a);height:110px}
.pd.p4 .bar{background:linear-gradient(#5a5a8a,#3a3a66);height:70px;color:#fff}
@keyframes grow{from{height:0}}
.pd .nm{font-weight:800}.pd .sc{color:var(--mute);font-variant-numeric:tabular-nums}
.crown{font-size:28px}
h3.t{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
.hbar{display:grid;grid-template-columns:110px 1fr 56px;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.hbar .tk{height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.hbar .fl{height:100%;border-radius:99px;transition:width 1s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:6px}
.kpi{padding:14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.kpi b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.tag{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800}
.tag.ok{background:rgba(34,229,139,.2);color:var(--ok)}.tag.no{background:rgba(255,77,109,.2);color:var(--bad)}.tag.na{background:rgba(255,255,255,.1);color:var(--mute)}
.scroll{max-height:420px;overflow:auto}
/* config */
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
input[type=text],input[type=number],select{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:10px;font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;width:100%}
input:focus,select:focus{outline:2px solid var(--cyan)}
.cfgrow{display:grid;grid-template-columns:34px 1.2fr 1fr 1.6fr;gap:8px;align-items:end;margin-bottom:8px}
.cfgrow .no{height:40px;display:grid;place-items:center;font-weight:900;color:var(--yel)}
.note{color:var(--mute);font-size:13px;line-height:1.5;margin-top:10px}
.hidden{display:none!important}
@media (max-width:980px){.stage,.grid2{grid-template-columns:1fr}.deck{position:static}.cfgrow{grid-template-columns:30px 1fr 1fr}.cfgrow .lk{grid-column:2/4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app" id="app"></div>

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const Q=QUESTOES.map((q,i)=>{
  let idx=q.opts.map((_,k)=>k);
  if(!q.fixed){const r=rng(i*97+13);for(let k=idx.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[idx[k],idx[j]]=[idx[j],idx[k]]}}
  return {...q,opts:idx.map(k=>q.opts[k]),ans:idx.indexOf(q.ans),track:Math.floor(i/2)};
});

function ac(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}return actx}
function tone(f,t0,dur,type="sine",vol=.16){const c=ac();if(!c||muted)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+.02)}
const sfx={
  ok(){[523,659,784,1047].forEach((f,k)=>tone(f,k*.09,.28,"triangle"))},
  no(){tone(180,0,.3,"sawtooth",.12);tone(130,.12,.35,"sawtooth",.12)},
  tick(){tone(900,0,.06,"square",.06)},
  end(){[392,330,262].forEach((f,k)=>tone(f,k*.14,.3,"square",.08))},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,k)=>tone(f,k*.11,.3,"triangle",.14))}
};

/* ============================ confete ============================ */
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",fit);fit();
function confetti(n=140,y=.35){
  const cols=[...COLORS,"#fff"];
  for(let k=0;k<n;k++)parts.push({x:innerWidth*(.2+Math.random()*.6),y:innerHeight*y,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,g:.32,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[k%cols.length],life:140+Math.random()*60});
  if(!raf)loop();
}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vx*=.99;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/40);cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()}
  raf=parts.length?requestAnimationFrame(loop):0}

  <section class="panel"><h3 class="t">Pontuação</h3>${bars}<h3 class="t" style="margin-top:22px">Acerto por área</h3>${bar("📘 Português",pt,"var(--cyan)")}${bar("📐 Matemática",mt,"var(--yel)")}</section></div>
  <section class="panel"><h3 class="t">Desempenho por descritor</h3><div class="scroll"><table class="tb"><thead><tr><th>#</th><th>Área</th><th>Descritor / habilidade</th><th>Faixa</th><th>Resultado</th><th>Equipe</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="btnrow" style="margin-top:16px;justify-content:flex-start"><button class="btn yel" data-act="csv">⬇ Baixar resultados (CSV)</button><button class="btn" data-act="confetti">🎉 Confete!</button><button class="btn" data-act="reset">↺ Reiniciar baladão</button></div></section>`;
}
function config(){
  const songs=CFG.songs.map((s,k)=>`<div class="cfgrow"><div class="no">${k+1}</div><label class="field">Música<input type="text" data-cs="${k}" data-f="t" value="${esc(s.t)}"></label><label class="field">Artista<input type="text" data-cs="${k}" data-f="a" value="${esc(s.a)}"></label><label class="field lk">Link (opcional)<input type="text" data-cs="${k}" data-f="link" placeholder="https://youtu.be/… (vazio = busca no YouTube)" value="${esc(s.link)}"></label></div>`).join("");
  const names=Array.from({length:CFG.nTeams},(_,k)=>`<label class="field">Equipe ${k+1}<input type="text" data-cn="${k}" value="${esc(CFG.names[k]||"")}"></label>`).join("");
  return `<section class="panel"><h3 class="t">Jogo</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
   <label class="field">Nº de equipes (1 = turma toda)<select id="nt">${[1,2,3,4,5,6].map(n=>`<option ${n===CFG.nTeams?"selected":""}>${n}</option>`).join("")}</select></label>
   <label class="field">Tempo por questão (s)<input type="number" id="lim" min="15" max="300" value="${CFG.limit}"></label></div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:12px">${names}</div>
   <div class="btnrow" style="justify-content:flex-start;margin-top:14px"><button class="btn yel" data-act="applycfg">Aplicar e zerar placar</button></div></section>
  <section class="panel"><h3 class="t">🎵 Playlist do baladão</h3>${songs}
   <p class="note">Cada faixa tem 1 questão de Português e 1 de Matemática. Cole um link do YouTube/Spotify/Deezer ou deixe vazio para abrir a busca. Para tocar offline, use o botão <b>📁 Meu áudio</b> na pista e escolha um arquivo do computador.</p>
   <div class="btnrow" style="justify-content:flex-start;margin-top:10px"><button class="btn" data-act="defaults">Restaurar playlist padrão</button></div></section>`;
}

/* ============================ jogo ============================ */
function startTimer(){stopTimer();S.left=CFG.limit;S.paused=false;timer=setInterval(()=>{
  if(S.paused||S.locked||S.view!=="play")return;S.left--;if(S.left<=5&&S.left>0)sfx.tick();
  if(S.left<=0){reveal(null,true)}else drawRing()},1000)}
function stopTimer(){clearInterval(timer);timer=null}
function pick(k){
  if(S.locked||S.view!=="play")return;reveal(k,false)}
function reveal(k,timeout){
  const q=Q[S.i];if(S.locked)return;S.locked=true;
  const t=S.teams[S.active];const ok=k!==null&&k===q.ans;
  let pts=0;
  if(k!==null||timeout){t.tries++}
  if(ok){t.hits++;t.streak++;pts=100+Math.round(50*S.left/CFG.limit)+(t.streak>1?25*(t.streak-1):0);t.score+=pts;sfx.ok();confetti(90)}
  else{t.streak=0;(timeout?sfx.end:sfx.no)()}
  S.res[S.i]={team:S.active,choice:k,ok,pts,timeout:!!timeout&&k===null,left:S.left};
  render();
}
function next(){
  if(!S.locked)return;
  if(S.i>=Q.length-1){S.view="board";stopTimer();render();sfx.win();confetti(260,.2);return}
  S.i++;S.locked=false;S.active=(S.active+1)%S.teams.length;startTimer();render();
}
function goto(i){S.i=i;S.locked=!!S.res[i];S.active=S.res[i]&&S.res[i].team!=null?S.res[i].team:S.active;if(!S.locked)startTimer();else stopTimer();S.view="play";render()}
function csv(){
  const rows=[["#","Area","Descritor","Habilidade","Faixa","Artista","Equipe","Resultado","Pontos"]];
  Q.forEach((q,i)=>{const r=S.res[i];rows.push([i+1,q.area==="PT"?"Português":"Matemática",q.d,q.skill,trackOf(i).t,trackOf(i).a,r?S.teams[r.team].name:"",r?(r.ok?"Acertou":r.timeout?"Tempo esgotado":"Errou"):"Não jogada",r?r.pts:0])});
  rows.push([]);rows.push(["Equipe","Pontos","Acertos","Tentativas"]);S.teams.forEach(t=>rows.push([t.name,t.score,t.hits,t.tries]));
  const txt="﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));a.download="baladao-saepe-resultados.csv";a.click()}

/* ============================ eventos ============================ */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;ac();
  if(a==="start"){S.view="play";startTimer();render();sfx.win()}
  else if(a==="view"){S.view=b.dataset.v;if(S.view==="play"&&!S.locked&&!timer)startTimer();render();if(S.view==="board")confetti(0)}
  else if(a==="pick")pick(+b.dataset.k);
  else if(a==="next")next();
  else if(a==="prev"&&S.i>0)goto(S.i-1);
  else if(a==="goto")goto(+b.dataset.i);
  else if(a==="skip")reveal(null,false);
  else if(a==="pause"){S.paused=!S.paused;render()}
  else if(a==="team"){if(!S.locked){S.active=+b.dataset.k;render()}}
  else if(a==="mute"){muted=!muted;render()}
  else if(a==="full")toggleFull();
  else if(a==="csv")csv();
  else if(a==="confetti"){confetti(220,.3);sfx.win()}
  else if(a==="reset"){if(confirm("Zerar placar e recomeçar o baladão?")){S=freshState();S.view="play";startTimer();render()}}
  else if(a==="applycfg"){
    CFG.nTeams=+$("#nt").value;CFG.limit=Math.max(15,Math.min(300,+$("#lim").value||60));
    document.querySelectorAll("[data-cn]").forEach(i=>CFG.names[+i.dataset.cn]=i.value.trim()||("Equipe "+(+i.dataset.cn+1)));
    saveCfg();S=freshState();S.view="play";startTimer();render()}
  else if(a==="defaults"){CFG.songs=PLAYLIST_PADRAO.map(x=>({...x}));saveCfg();render()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="file"&&e.target.files[0]){if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(e.target.files[0]);render();const au=$("#au");au&&au.play().catch(()=>{})}
  if(e.target.id==="nt"){CFG.nTeams=+e.target.value;const keep=S;saveCfg();render()}
});
document.addEventListener("input",e=>{
  const t=e.target;if(t.dataset&&t.dataset.cs!==undefined){CFG.songs[+t.dataset.cs][t.dataset.f]=t.value;saveCfg()}
});
document.addEventListener("play",e=>{const v=$("#vinyl"),q=$("#eq");v&&v.classList.remove("paused");q&&q.classList.remove("off")},true);
document.addEventListener("pause",e=>{if(e.target.tagName==="AUDIO"){const v=$("#vinyl"),q=$("#eq");v&&v.classList.add("paused");q&&q.classList.add("off")}},true);
function toggleFull(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(k==="f"){toggleFull();return}
  if(k==="m"){muted=!muted;render();return}
  if(S.view==="splash"&&(k==="enter"||k===" ")){e.preventDefault();S.view="play";startTimer();render();return}
  if(S.view!=="play")return;
  if("abcde".includes(k)&&k.length===1){pick("abcde".indexOf(k));return}
  if(k==="enter"||k==="arrowright"){e.preventDefault();S.locked?next():null}
  if(k==="arrowleft"&&S.i>0)goto(S.i-1);
  if(k==="p"){S.paused=!S.paused;render()}
  if(k==="r"&&!S.locked)reveal(null,false);
});
render();
</script>
</body>
</html>
